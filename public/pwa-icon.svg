<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient matching Header: from-emerald-700 to-emerald-500 -->
    <linearGradient id="pakinoBgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glossy Overlay -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Shadow for Recycling Glyph -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base App Icon Squircle Background -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#pakinoBgGrad)" />
  <rect x="0" y="0" width="512" height="256" rx="116" fill="url(#glossGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Exact Pure White Recycle Emblem (Lucide standard vector scaled & centered) -->
  <g filter="url(#glyphShadow)" transform="translate(256, 256) scale(14.5) translate(-12, -12)" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5" />
    <path d="M11 19h8.2a1.8 1.8 0 0 0 1.5-1 1.8 1.8 0 0 0 0-1.8L17 9.5" />
    <path d="m7 19-3-4 3-4" />
    <path d="m14 13.5 3-4 3 4" />
    <path d="m11.9 4.5 4.1 7" />
    <path d="m7.9 11.5 4.1-7" />
  </g>
</svg>
